name: sofafunk

# Target: Linux Docker Engine, a public IPv4 address, and two DNS A records.
# Run from this directory. Never commit .env or paste `compose config` output.
services:
  signal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      ROOM_SECRET: ${ROOM_SECRET:?Set ROOM_SECRET in deploy/.env}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in deploy/.env}
      TURN_URLS: turn:${TURN_DOMAIN:?Set TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp
    # No published port: only Caddy reaches this service on the Docker network.
    expose:
      - "8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging: &logs
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      signal:
        condition: service_healthy
    environment:
      SOFA_DOMAIN: ${SOFA_DOMAIN:?Set SOFA_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logs

  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    # Linux host networking avoids NAT inside Docker for the relay port range.
    network_mode: host
    entrypoint: ["/bin/sh", "/etc/sofafunk/start-coturn.sh"]
    command: []
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in deploy/.env}
      TURN_DOMAIN: ${TURN_DOMAIN:?Set TURN_DOMAIN in deploy/.env}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in deploy/.env}
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:?Set TURN_LISTEN_IP in deploy/.env}
    volumes:
      - ./coturn.conf:/etc/sofafunk/coturn.conf:ro
      - ./start-coturn.sh:/etc/sofafunk/start-coturn.sh:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
      - /var/lib/coturn:mode=1777,size=16m
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging: *logs

volumes:
  caddy_data:
  caddy_config:
