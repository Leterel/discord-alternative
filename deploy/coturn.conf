# See SERVER.md. Dynamic realm/IP/secret are appended privately at startup.
listening-port=3478
min-port=49160
max-port=49200
fingerprint
use-auth-secret
stale-nonce=600
user-quota=8
total-quota=24
max-bps=2500000
bps-capacity=10000000

# TURN-over-UDP/TCP only in this minimal setup; TLS is NOT configured.
# WebRTC encrypts the chat/audio/video payload independently of TURN transport.
no-tls
dtls=false
no-tcp-relay
no-multicast-peers
cli=false
no-software-attribute

# An authenticated client must not use the relay to reach private services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
